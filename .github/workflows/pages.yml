name: Deploy blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One Pages deployment at a time. An in-progress deploy finishes instead of being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - run: pnpm install --frozen-lockfile
      # Repository variables: Settings → Secrets and variables → Actions → Variables.
      # SITE_URL, BASE_PATH, GOOGLE_SITE_VERIFICATION, CUSTOM_DOMAIN.
      # Leave them unset to keep today's site at https://leejunyeolkor.github.io/me.
      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            if ! printf '%s' "${CUSTOM_DOMAIN}" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'; then
              echo "CUSTOM_DOMAIN must be a hostname such as example.com" >&2
              exit 1
            fi
          fi
          if [ -n "${SITE_URL}" ]; then
            export NEXT_PUBLIC_SITE_URL="${SITE_URL}"
          elif [ -n "${CUSTOM_DOMAIN}" ]; then
            export NEXT_PUBLIC_SITE_URL="https://${CUSTOM_DOMAIN}"
          else
            export NEXT_PUBLIC_SITE_URL="https://leejunyeolkor.github.io/me"
          fi
          if [ -n "${BASE_PATH}" ]; then
            export NEXT_PUBLIC_BASE_PATH="${BASE_PATH}"
          elif [ -n "${CUSTOM_DOMAIN}" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
          else
            export NEXT_PUBLIC_BASE_PATH="/me"
          fi
          if [ -n "${GOOGLE_SITE_VERIFICATION}" ]; then
            export NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION="${GOOGLE_SITE_VERIFICATION}"
          fi
          pnpm --filter @apps/client build
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            printf '%s\n' "${CUSTOM_DOMAIN}" > apps/client/out/CNAME
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/out
      - uses: actions/deploy-pages@v4
        id: deployment
