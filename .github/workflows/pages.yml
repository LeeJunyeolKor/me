name: Deploy blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One Pages deployment at a time. An in-progress deploy finishes instead of being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apps/client build
        env:
          NEXT_PUBLIC_BASE_PATH: /me
          NEXT_PUBLIC_SITE_URL: https://leejunyeolkor.github.io/me
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/out
      - uses: actions/deploy-pages@v4
        id: deployment
