packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: false
# Transitive security pins. pnpm 11 reads overrides from this file, not package.json.
# braces has no published 3.0.4, so GHSA-vfj7-8cjw-p6xm stays until upstream ships a patch.
overrides:
  postcss: 8.5.32
  source-map-js: 1.2.2
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fast-uri@>=4.0.0 <4.2.3': 4.2.3
  'postcss-selector-parser@<7.1.6': 7.1.6
  # GHSA-g3hv-75wg-m249 is fixed in minimatch >=11.0.1. typescript-estree calls
  # minimatch.minimatch(path, pattern, { dot: true }), which 11.0.3 still exports.
  # Do not override 3.x: eslint 8 and its plugins call require('minimatch') as a function,
  # and minimatch 11's module export is no longer callable.
  'minimatch@>=10.0.0 <11.0.1': 11.0.3
